site_name: "Curso de Prompt Engineering"
site_description: "Curso práctico de Prompt Engineering en 5 días y 30 horas"
site_author: "Guillem Hernández Sola"
site_url: "https://docs.agile611.com/curso-prompt-engineering/"

repo_name: "agile611/curso-prompt-engineering"
repo_url: "https://github.com/agile611/curso-prompt-engineering"

docs_dir: "docs"
site_dir: "site"

theme:
  name: "material"
  language: "es"

  logo: "https://www.agile611.com/wp-content/uploads/2020/09/Negativo.png"
  favicon: "https://www.agile611.com/wp-content/uploads/2019/07/cropped-agile611-1-e1563910774746-1-32x32.png"

  font:
    text: "Nunito"
    code: "Nunito"

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: "Cambiar a modo oscuro"

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: "Cambiar a modo claro"

  icon:
    logo: material/chart-timeline-variant
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list

  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - es

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/custom.js

nav:
  - "Inicio": index.md

  - "Guía del curso":
      - "Programa y calendario": guia-del-curso/programa.md
      - "Objetivos de aprendizaje": guia-del-curso/objetivos.md
      - "Metodología": guia-del-curso/metodologia.md
      - "Preparación y herramientas": guia-del-curso/preparacion.md

  - "Temario":
      - "1 · Fundamentos":
          - dia-01-fundamentos/index.md
          - "Introducción y diagnóstico": dia-01-fundamentos/01-introduccion-y-diagnostico.md
          - "Funcionamiento y limitaciones": dia-01-fundamentos/02-funcionamiento-y-limitaciones.md
          - "Anatomía del prompt": dia-01-fundamentos/03-anatomia-del-prompt.md
          - "Taller de prompts": dia-01-fundamentos/04-taller-de-prompts.md
          - "Caso de uso y entregable": dia-01-fundamentos/05-caso-de-uso-y-entregable.md

      - "2 · Técnicas y formatos":
          - dia-02-tecnicas/index.md
          - "Zero-shot y few-shot": dia-02-tecnicas/01-zero-shot-y-few-shot.md
          - "Descomposición y verificación": dia-02-tecnicas/02-descomposicion-y-verificacion.md
          - "Roles, tono y formatos": dia-02-tecnicas/03-roles-tono-y-formatos.md
          - "Laboratorio comparativo": dia-02-tecnicas/04-laboratorio-comparativo.md
          - "Biblioteca de prompts": dia-02-tecnicas/05-biblioteca-de-prompts.md

      - "3 · Evaluación y seguridad":
          - dia-03-evaluacion-y-seguridad/index.md
          - "Diseño de pruebas": dia-03-evaluacion-y-seguridad/01-diseno-de-pruebas.md
          - "Refinamiento y versionado": dia-03-evaluacion-y-seguridad/02-refinamiento-y-versionado.md
          - "Fiabilidad, sesgos y privacidad": dia-03-evaluacion-y-seguridad/03-fiabilidad-sesgos-y-privacidad.md
          - "Seguridad y prompt injection": dia-03-evaluacion-y-seguridad/04-seguridad-y-prompt-injection.md
          - "Laboratorio de evaluación": dia-03-evaluacion-y-seguridad/05-laboratorio-de-evaluacion.md

      - "4 · Aplicaciones profesionales":
          - dia-04-aplicaciones/index.md
          - "Comunicación y creatividad": dia-04-aplicaciones/01-comunicacion-y-creatividad.md
          - "Extracción y análisis": dia-04-aplicaciones/02-extraccion-y-analisis.md
          - "Código y asistencia técnica": dia-04-aplicaciones/03-codigo-y-asistencia-tecnica.md
          - "Diseño de flujos": dia-04-aplicaciones/04-diseno-de-flujos.md
          - "Desarrollo del prototipo": dia-04-aplicaciones/05-desarrollo-del-prototipo.md

      - "5 · Proyecto e integración":
          - dia-05-proyecto/index.md
          - "Construcción final": dia-05-proyecto/01-construccion-final.md
          - "Pruebas y correcciones": dia-05-proyecto/02-pruebas-y-correcciones.md
          - "Documentación y entrega": dia-05-proyecto/03-documentacion-y-entrega.md
          - "Presentaciones y revisión": dia-05-proyecto/04-presentaciones-y-revision.md
          - "Transferencia al trabajo": dia-05-proyecto/05-transferencia-al-trabajo.md

  - "Proyecto final":
      - proyecto-final/index.md
      - "Casos de uso": proyecto-final/casos-de-uso.md
      - "Requisitos y entregables": proyecto-final/requisitos-y-entregables.md
      - "Guía de presentación": proyecto-final/guia-de-presentacion.md

  - "Plantillas":
      - plantillas/index.md
      - "Ficha de prompt": plantillas/ficha-de-prompt.md
      - "Ficha de caso de uso": plantillas/ficha-de-caso-de-uso.md
      - "Biblioteca de prompts": plantillas/biblioteca-de-prompts.md
      - "Matriz de evaluación": plantillas/matriz-de-evaluacion.md
      - "Registro de versiones": plantillas/registro-de-versiones.md
      - "Checklist de seguridad": plantillas/checklist-de-seguridad.md

  - "Recursos":
      - "Glosario": recursos/glosario.md
      - "Herramientas": recursos/herramientas.md
      - "Lecturas": recursos/lecturas.md